name: Compilar SkyVision T400 NoAVX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Instalar CUDA Toolkit 12.4 completo
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda-version: '12.4.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'

      - name: Configurar compilador MSVC C++
        uses: ilammy/msvc-dev-cmd@v1

      - name: Instalar Ninja
        run: choco install ninja

      - name: Clonar repositorios de código
        run: |
          git clone --depth 1 https://github.com/SkYContact/SkyVision.cpp.git skyvision
          cd skyvision
          git clone --depth 1 https://github.com/ggml-org/ggml.git ggml

      - name: Parchear exportación de ggml_graph_next_uid para Windows MSVC
        working-directory: skyvision
        shell: powershell
        run: |
          # Exportar explícitamente ggml_graph_next_uid para resolver LNK2019
          (Get-Content ggml/src/ggml-impl.h) -replace 'uint64_t ggml_graph_next_uid', 'GGML_API uint64_t ggml_graph_next_uid' | Set-Content ggml/src/ggml-impl.h
          (Get-Content ggml/src/ggml.c) -replace 'uint64_t ggml_graph_next_uid', 'GGML_API uint64_t ggml_graph_next_uid' | Set-Content ggml/src/ggml.c
          Write-Host "Parche de exportacion de GGML aplicado correctamente."

      - name: Configurar CMake (Athlon II X3 + Turing T400)
        working-directory: skyvision
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=OFF `
            -DGGML_CUDA=ON `
            -DCMAKE_CUDA_ARCHITECTURES=75 `
            -DCMAKE_CUDA_FLAGS="-allow-unsupported-compiler" `
            -DGGML_NATIVE=OFF `
            -DGGML_AVX=OFF `
            -DGGML_AVX2=OFF `
            -DGGML_AVX512=OFF `
            -DGGML_FMA=OFF `
            -DGGML_F16C=OFF

      - name: Compilar vqa-cli
        working-directory: skyvision
        run: |
          cmake --build build --config Release --target vqa-cli --parallel 4

      - name: Empaquetar binarios y dependencias
        working-directory: skyvision
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist

          # 1. Localizar el ejecutable en cualquier subcarpeta
          $exeFile = Get-ChildItem -Path build -Filter "vqa-cli.exe" -Recurse | Select-Object -First 1
          if ($exeFile) {
              Write-Host "Ejecutable encontrado en: $($exeFile.FullName)"
              Copy-Item $exeFile.FullName -Destination dist/
          } else {
              Write-Error "ERROR: No se generó vqa-cli.exe"
              exit 1
          }

          # 2. Copiar cualquier librería compilada
          Get-ChildItem -Path build -Filter "*.dll" -Recurse | ForEach-Object {
              Copy-Item $_.FullName -Destination dist/ -Force
          }

          # 3. Incluir las DLLs de CUDA 12.4
          if (Test-Path "$env:CUDA_PATH\bin") {
              $cudaDlls = @("cudart64_12.dll", "cublas64_12.dll", "cublasLt64_12.dll")
              foreach ($dll in $cudaDlls) {
                  $dllPath = Join-Path "$env:CUDA_PATH\bin" $dll
                  if (Test-Path $dllPath) {
                      Copy-Item $dllPath -Destination dist/ -Force
                  }
              }
          }

      - name: Subir artefacto compilado
        uses: actions/upload-artifact@v4
        with:
          name: SkyVision-T400-NoAVX-Win10
          path: skyvision/dist/*
